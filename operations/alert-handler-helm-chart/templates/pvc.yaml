{{- if .Values.persistence.enabled }}
# Incidents and pending approvals (settings.state_file); see docs/incidents.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "alert-handler.fullname" . }}-state
  labels:
    {{- include "alert-handler.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
