# Demo rules. Actions that need a cluster are commented out - compose has no
# Kubernetes API, and the handler would (correctly) report them as failures.
settings:
  dry_run: false
  cooldown: 60          # a firing alert re-notifies every repeat_interval
  action_timeout: 10
  workers: 4
  allowed_namespaces: [] # empty = any namespace; set an allow-list in a cluster
  # Incidents (docs/incidents.md): links point at the handler's own port, and
  # silences go to the compose Alertmanager. No Jira here: rule 3 gates a log
  # line where a real site would gate `jira_create`.
  public_url: http://localhost:8080
  alertmanager:
    url: http://alertmanager:9093

rules:
  # 1. Everything that arrives gets a line, firing and resolved alike.
  - name: log-everything
    status: any
    cooldown: 0
    actions:
      - type: log
        message: "{{ status }} {{ labels.alertname }} ({{ labels.severity }}) ns={{ labels.namespace }} summary={{ annotations.summary }}"

  # 2. The remediation the demo is really about: a workload alert triggers a
  #    command, an outbound HTTP call, and - in a cluster - a rollout restart.
  - name: demo-remediation
    match:
      alertname: DemoWorkloadUnhealthy
    match_re:
      severity: 'warning|critical'
    cooldown: 60
    actions:
      # A script from ./runbooks, handed one credential from ./secrets by name.
      # Alert labels reach it as ALERT_LABEL_<NAME>, so it needs no JSON parsing.
      - type: runbook
        name: recycle.sh
        args: ["{{ labels.namespace }}", "{{ labels.deployment }}"]
        secret_env:
          DEMO_TOKEN: demo-token
      - type: http
        method: GET
        url: http://alertmanager:9093/api/v2/status
      # - type: k8s_rollout_restart
      #   kind: deployment
      #   namespace: "{{ labels.namespace }}"
      #   name: "{{ labels.deployment }}"
      # - type: k8s_scale
      #   kind: deployment
      #   namespace: "{{ labels.namespace }}"
      #   name: "{{ labels.deployment }}"
      #   replicas: 4

  # 3. An incident for the same alert: silence it, note a mitigation, then wait for a person at
  #    http://localhost:8080/approvals before the step that would open a ticket.
  #    Resolve it at http://localhost:8080/incidents to lift the silence.
  - name: demo-incident
    incident: true
    match:
      alertname: DemoWorkloadUnhealthy
    cooldown: 0
    actions:
      - type: am_silence
        duration: 30m
        labels: [alertname, namespace, deployment]
      - type: log
        message: "mitigation for {{ labels.deployment }} in {{ labels.namespace }} would run here"
      - type: log
        approval: required
        message: "{{ approval.by }} approved: this is where jira_create would open a ticket for {{ labels.alertname }}"
